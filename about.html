<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>About | Vusi's Hair Salon</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header class="site-header">
  <nav class="navbar" aria-label="Primary navigation">

    <a href="index.html" class="brand" id="brandLink">Vusi's</a>

    <!-- ✅ MOBILE MENU BUTTON -->
    <button
      class="menu-toggle"
      type="button"
      onclick="toggleMenu()"
    >
      Menu
    </button>

    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
    </div>

    <a href="register.html" class="nav-cta">Book Now</a>

  </nav>
</header>

<main class="admin-page">

  <!-- HERO -->
  <section class="admin-hero">
    <div>
      <p class="eyebrow">About Us</p>
      <h1 id="aboutTitle"></h1>
      <p id="aboutStory"></p>
    </div>
  </section>

  <!-- CONTENT GRID -->
  <section class="admin-grid">

    <div class="admin-panel">
      <p class="eyebrow">Our Mission</p>
      <h2>Why we exist</h2>
      <p id="aboutMission" class="section-text"></p>
    </div>

    <div class="admin-panel">
      <p class="eyebrow">Salon Numbers</p>
      <h2>Built with consistency</h2>

      <div class="service-breakdown">

        <div class="breakdown-row">
          <span>Founded</span>
          <strong id="aboutFounded"></strong>
        </div>

        <div class="breakdown-row">
          <span>Clients</span>
          <strong id="aboutClients"></strong>
        </div>

        <div class="breakdown-row">
          <span>Looks Created</span>
          <strong id="aboutLooks"></strong>
        </div>

      </div>
    </div>

  </section>

</main>

<!-- ✅ MOBILE MENU SCRIPT -->
<script>
  function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("is-open");
  }
</script>

<script src="js/content-store.js"></script>

<script>
  const currentUser = JSON.parse(localStorage.getItem("currentUser"));
  const params = new URLSearchParams(window.location.search);
  const from = params.get("from");

  function getFallbackPage() {
    if (currentUser || from === "home") {
      return "home.html";
    }
    return "index.html";
  }

  function setupNavigation() {
    const fallback = getFallbackPage();

    const brandLink = document.getElementById("brandLink");

    if (brandLink) {
      brandLink.href = fallback;
    }
  }

  // SAFE DATA LOADING
  const about = getAboutDetails ? getAboutDetails() : {
    title: "",
    story: "",
    mission: "",
    founded: "",
    clients: "",
    looks: ""
  };

  document.getElementById("aboutTitle").textContent = about.title;
  document.getElementById("aboutStory").textContent = about.story;
  document.getElementById("aboutMission").textContent = about.mission;
  document.getElementById("aboutFounded").textContent = about.founded;
  document.getElementById("aboutClients").textContent = about.clients;
  document.getElementById("aboutLooks").textContent = about.looks;

  setupNavigation();
</script>

</body>
</html>
