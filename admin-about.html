<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin About | Vusi's</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
  <nav class="navbar" aria-label="Admin navigation">

    <a href="admin-dashboard.html" class="brand">
      Vusi's Admin
    </a>

    <!-- ✅ MOBILE MENU BUTTON -->
    <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>

    <div class="nav-links" id="navLinks">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-gallery.html">Gallery</a>
      <a href="admin-contact.html">Contact</a>
      <a href="admin-about.html">About</a>
    </div>

    <a href="index.html" class="nav-cta logout-button">
      Logout
    </a>

  </nav>
</header>

<main class="admin-page">

  <!-- HERO -->
  <section class="admin-hero">
    <div>
      <p class="eyebrow">About Manager</p>
      <h1>Edit salon story.</h1>
      <p>
        Update the public about page and reusable salon statistics.
      </p>
    </div>
  </section>

  <!-- FORM -->
  <section class="admin-panel">

    <form id="aboutForm">

      <div class="form-group">
        <label for="aboutTitle">Title</label>
        <input id="aboutTitle" type="text" placeholder="Salon title">
      </div>

      <div class="form-group">
        <label for="aboutStory">Story</label>
        <input id="aboutStory" type="text" placeholder="Salon story">
      </div>

      <div class="form-group">
        <label for="aboutMission">Mission</label>
        <input id="aboutMission" type="text" placeholder="Salon mission">
      </div>

      <div class="form-group">
        <label for="aboutFounded">Founded</label>
        <input id="aboutFounded" type="text" placeholder="Year founded">
      </div>

      <div class="form-group">
        <label for="aboutClients">Clients</label>
        <input id="aboutClients" type="number" placeholder="Total clients">
      </div>

      <div class="form-group">
        <label for="aboutLooks">Looks Created</label>
        <input id="aboutLooks" type="number" placeholder="Total styles created">
      </div>

      <button class="button" type="submit">
        Save About Page
      </button>

    </form>

  </section>

</main>

<!-- ✅ MOBILE MENU SCRIPT -->
<script>
  function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("is-open");
  }
</script>

<script src="js/content-store.js"></script>
<script src="js/admin-about.js"></script>

</body>
</html>
