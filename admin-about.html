<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin About | Vusi's</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <nav class="navbar">
    <a href="admin-dashboard.html" class="brand">Vusi's Admin</a>
    <div class="nav-links">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-gallery.html">Gallery</a>
      <a href="admin-contact.html">Contact</a>
      <a href="admin-about.html">About</a>
    </div>
  </nav>
</header>

<main class="admin-page">
  <section class="admin-hero">
    <div>
      <p class="eyebrow">About Manager</p>
      <h1>Edit salon story.</h1>
      <p>Update the public about page and reusable salon statistics.</p>
    </div>
  </section>

  <section class="admin-panel">
    <form id="aboutForm">
      <div class="form-group"><label>Title</label><input id="aboutTitle"></div>
      <div class="form-group"><label>Story</label><input id="aboutStory"></div>
      <div class="form-group"><label>Mission</label><input id="aboutMission"></div>
      <div class="form-group"><label>Founded</label><input id="aboutFounded"></div>
      <div class="form-group"><label>Clients</label><input id="aboutClients"></div>
      <div class="form-group"><label>Looks Created</label><input id="aboutLooks"></div>
      <button class="button" type="submit">Save About Page</button>
    </form>
  </section>
</main>

<script src="js/content-store.js"></script>
<script src="js/admin-about.js"></script>
</body>
</html>
