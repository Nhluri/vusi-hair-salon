<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Contact | Vusi's</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <nav class="navbar">
    <a href="admin-dashboard.html" class="brand">Vusi's Admin</a>
    <div class="nav-links">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-gallery.html">Gallery</a>
      <a href="admin-contact.html">Contact</a>
      <a href="admin-about.html">About</a>
    </div>
  </nav>
</header>

<main class="admin-page">
  <section class="admin-hero">
    <div>
      <p class="eyebrow">Contact Manager</p>
      <h1>Edit public contact details.</h1>
      <p>Update phone, email, address, WhatsApp, and operating hours across the site.</p>
    </div>
  </section>

  <section class="admin-panel">
    <form id="contactForm">
      <div class="form-group"><label>Phone</label><input id="phone"></div>
      <div class="form-group"><label>Email</label><input id="email"></div>
      <div class="form-group"><label>Address</label><input id="address"></div>
      <div class="form-group"><label>Hours</label><input id="hours"></div>
      <div class="form-group"><label>WhatsApp</label><input id="whatsapp"></div>
      <button class="button" type="submit">Save Contact Details</button>
    </form>
  </section>
</main>

<script src="js/content-store.js"></script>
<script src="js/admin-contact.js"></script>
</body>
</html>
