<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Employees | Vusi's Hair Salon</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header class="site-header">
  <nav class="navbar" aria-label="Primary navigation">

    <a href="admin-dashboard.html" class="brand">
      Vusi's Admin
    </a>

    <!-- 🔥 MOBILE MENU BUTTON -->
    <button class="menu-toggle" onclick="toggleMenu()">
      ☰ Menu
    </button>

    <!-- 🔥 NAV LINKS -->
    <div class="nav-links" id="navLinks">
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-employees.html">Employees</a>
      <a href="admin-users.html">Users</a>
      <a href="admin-walkins.html">Walk-ins</a>
    </div>

    <button class="nav-cta logout-button" onclick="logout()">
      Logout
    </button>

  </nav>
</header>

<main class="admin-employees-page">

  <!-- HERO -->
  <section class="admin-hero employee-admin-hero">
    <div>
      <p class="eyebrow">Staff Management</p>
      <h1>Build the salon team.</h1>
      <p>
        Add employees, assign specialties, track availability, and monitor workload.
      </p>
    </div>

    <aside class="admin-focus-card">
      <span>Team Size</span>
      <strong id="teamCount">0 employees</strong>
      <p id="teamSummary">No employees added yet.</p>
    </aside>
  </section>

  <!-- GRID -->
  <section class="employee-admin-grid">

    <!-- ADD EMPLOYEE -->
    <section class="admin-panel">
      <div class="panel-heading">
        <p class="eyebrow">Add Staff</p>
        <h2>New employee</h2>
      </div>

      <form id="employeeForm">
        <div class="form-group">
          <label>Name</label>
          <input id="empName" type="text" placeholder="Employee name" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input id="empEmail" type="email" placeholder="Employee email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input id="empPass" type="password" placeholder="Temporary password" />
        </div>

        <div class="form-group">
          <label>Specialty</label>
          <select id="empSpecialty">
            <option>Hair Styling</option>
            <option>Nail Care</option>
            <option>Beard Grooming</option>
            <option>All Services</option>
          </select>
        </div>

        <div class="form-group">
          <label>Availability</label>
          <select id="empAvailability">
            <option>Available</option>
            <option>Busy</option>
            <option>Off Duty</option>
          </select>
        </div>

        <button type="submit" class="button">Add Employee</button>
      </form>
    </section>

    <!-- STAFF INSIGHT -->
    <section class="admin-panel">
      <div class="panel-heading">
        <p class="eyebrow">Salon Insight</p>
        <h2>Staff coverage</h2>
      </div>

      <div id="coverageList" class="service-breakdown"></div>
    </section>

  </section>

  <!-- DIRECTORY -->
  <section class="admin-panel employee-directory">

    <div class="panel-heading panel-heading-row">
      <div>
        <p class="eyebrow">Directory</p>
        <h2>Employees</h2>
      </div>

      <input
        id="search"
        type="search"
        placeholder="Search employee"
        onkeyup="searchEmployee()"
      />
    </div>

    <div id="employeeList" class="employee-list"></div>

  </section>

</main>

<script src="js/admin-employees.js"></script>

<!-- 🔥 MOBILE MENU SCRIPT -->
<script>
function toggleMenu() {
  let nav = document.getElementById("navLinks");
  nav.classList.toggle("is-open");
}
</script>

</body>
</html>
