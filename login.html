<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Vusi's Hair Salon</title>

  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Responsive structural flex engine wrapping the original HTML layout tags */
    .auth-hero {
      display: flex;
      gap: 2rem;
      align-items: stretch;
      min-height: calc(100vh - 120px);
      width: 100%;
    }

    .auth-copy {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .auth-card {
      flex: 1;
      min-width: 300px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .image-panel {
      flex: 1;
      min-width: 280px;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      min-height: 350px;
    }

    .image-panel img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-note {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      background: rgba(5, 9, 20, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 1rem;
      border-radius: calc(var(--radius) / 2);
      border: 1px solid var(--line);
      z-index: 2;
    }

    .image-note span {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--blue-soft);
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }

    .image-note strong {
      color: var(--cream);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .nav-actions-group {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .nav-home-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-home-link:hover {
      color: var(--cream);
    }

    /* ================= DEVICE AND SPLIT-SCREEN BREAKPOINTS ================= */
    @media (max-width: 950px) {
      .auth-hero {
        flex-direction: column;
        align-items: initial;
        gap: 1.5rem;
      }
      
      .image-panel {
        min-height: 300px;
        height: 350px;
      }
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Primary navigation">
      <a href="index.html" class="brand" aria-label="Vusi's Hair Salon home">
        Vusi's
      </a>

      <div class="nav-actions-group">
        <a href="index.html" class="nav-home-link">Home</a>
        <a href="register.html" class="nav-cta">Register</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-hero auth-hero-login" aria-labelledby="login-title">
      <div class="auth-copy">
        <p class="eyebrow">Welcome Back</p>

        <h1 id="login-title">Return to your selected look.</h1>

        <p>
          Login to continue booking your saved service or explore a fresh style from the studio menu.
        </p>
      </div>

      <section class="auth-card" aria-label="Login form">
        <p class="form-kicker">Account Access</p>

        <h2>Login</h2>

        <form onsubmit="event.preventDefault(); login();">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="button">Login</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="register.html">Register</a>
        </p>
      </section>

      <aside class="image-panel" aria-label="Selected service preview">
        <img
          id="selectedLookImage"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23aab4c4' stroke-width='1' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/></svg>"
          alt="Selected service preview from Vusi's Hair Salon"
        />

        <div class="image-note">
          <span>Selected Look</span>
          <strong id="selectedLookTitle">
            Your appointment is waiting.
          </strong>
        </div>
      </aside>
    </section>
  </main>

  <script src="js/auth.js"></script>

  <script>
    const selectedService = localStorage.getItem("selectedService");
    const selectedImage = localStorage.getItem("selectedImage");

    const selectedLookImage = document.getElementById("selectedLookImage");
    const selectedLookTitle = document.getElementById("selectedLookTitle");

    if (selectedService && selectedImage && selectedLookImage && selectedLookTitle) {
      selectedLookImage.src = selectedImage;
      selectedLookImage.alt = selectedService + " preview from Vusi's Hair Salon";
      selectedLookTitle.textContent = selectedService + " selected. Login to continue.";
    }
  </script>
</body>
</html>
